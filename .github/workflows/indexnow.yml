name: Notify search engines with IndexNow
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'sitemap.xml'
      - 'video-sitemap.xml'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*.html
            /*.xml
            /scripts/submit-indexnow.mjs
          sparse-checkout-cone-mode: false
      - name: Submit updated public pages after deployment
        run: node scripts/submit-indexnow.mjs
