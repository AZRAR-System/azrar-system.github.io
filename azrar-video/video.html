<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="utf-8">
<title>AZRAR tour</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
/* Fonts: Tajawal only (brand rule 2). Colours: var(--az-*) only (brand rule 1). */
@font-face{font-family:'Tajawal';font-weight:400;src:url(assets/fonts/tajawal-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-weight:500;src:url(assets/fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-weight:700;src:url(assets/fonts/tajawal-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-weight:800;src:url(assets/fonts/tajawal-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-weight:400;src:url(assets/fonts/tajawal-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Tajawal';font-weight:500;src:url(assets/fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Tajawal';font-weight:700;src:url(assets/fonts/tajawal-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Tajawal';font-weight:800;src:url(assets/fonts/tajawal-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--az-bg);font-family:'Tajawal',sans-serif;color:var(--az-text-1)}
#stage{position:absolute;inset:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;will-change:transform}
#o1{width:900px;height:900px;background:color-mix(in srgb,var(--az-primary-hover) 55%,transparent);left:-200px;top:-300px}
#o2{width:760px;height:760px;background:color-mix(in srgb,var(--az-accent) 28%,transparent);right:-220px;bottom:-320px}
#grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(var(--az-row-border) 1px,transparent 1px),linear-gradient(90deg,var(--az-row-border) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
.scene{position:absolute;inset:0;opacity:0}
.head{position:absolute;right:170px;top:62px;width:1580px;text-align:right}
.h1{font-size:84px;font-weight:800;line-height:1.15;color:var(--az-text-1);display:flex;flex-wrap:wrap;gap:0 22px}
.h2{font-size:36px;font-weight:500;color:var(--az-text-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:0 12px}
.w{display:inline-block;will-change:transform,opacity}
.bar{position:absolute;right:170px;top:46px;width:120px;height:8px;border-radius:var(--az-radius-full);background:var(--az-primary)}
.frame{position:absolute;left:180px;top:300px;width:1560px;height:742px;border-radius:28px;background:var(--az-surface-1);border:2px solid var(--az-border-2);overflow:hidden;box-shadow:0 40px 120px var(--az-overlay),0 0 0 1px var(--az-primary-ring)}
.frame .chrome{position:absolute;left:0;right:0;top:0;height:0}
.shot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.shot img{display:block;width:100%;height:auto;position:absolute;left:0;top:0}
.chip{position:absolute;display:flex;align-items:center;gap:16px;padding:18px 30px;border-radius:var(--az-radius-md);background:var(--az-surface-2);border:2px solid var(--az-border-2);box-shadow:0 24px 70px var(--az-overlay);will-change:transform,opacity;opacity:0;white-space:nowrap}
.chip .dot{width:16px;height:16px;border-radius:50%}
.chip .lab{font-size:30px;font-weight:500;color:var(--az-text-2)}
.chip .num{font-size:46px;font-weight:800;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.chip.ok .dot{background:var(--az-accent);box-shadow:0 0 0 8px var(--az-accent-ring)}.chip.ok .num{color:var(--az-accent)}
.chip.bad .dot{background:var(--az-danger);box-shadow:0 0 0 8px var(--az-danger-soft)}.chip.bad .num{color:var(--az-danger)}
.chip.pri .dot{background:var(--az-primary);box-shadow:0 0 0 8px var(--az-primary-soft)}.chip.pri .num{color:var(--az-primary)}
#intro,#outro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#intro img,#outro img{width:300px;height:300px;border-radius:64px;box-shadow:0 30px 100px var(--az-primary-ring);will-change:transform}
#outro img{width:190px;height:190px;border-radius:42px}
.big{font-size:92px;font-weight:800;margin-top:44px;display:flex;gap:0 24px;justify-content:center;flex-wrap:wrap}
.sub{font-size:40px;font-weight:500;color:var(--az-text-2);margin-top:16px;display:flex;gap:0 14px;justify-content:center;flex-wrap:wrap}
.cta{margin-top:46px;padding:22px 60px;border-radius:var(--az-radius-full);background:var(--az-primary-hover);color:var(--az-text-1);font-size:46px;font-weight:700;direction:ltr;letter-spacing:.5px;box-shadow:0 20px 70px var(--az-primary-ring)}
#progress{position:absolute;left:0;bottom:0;height:6px;width:100%;transform-origin:100% 50%;background:var(--az-primary);opacity:.9}
</style>
</head>
<body>
<div id="stage">
  <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div id="grid"></div>
  <div class="scene" id="intro"><img src="assets/logo.png" alt=""><div class="big" data-words="نظام إدارة مكاتب العقارات"></div><div class="sub" data-words="عقودك وأقساطك وعقاراتك بواجهة عربية"></div></div>
  <div id="scenes"></div>
  <div class="scene" id="outro"><img src="assets/logo.png" alt=""><div class="big" data-words="جرّب مجانًا 30 يومًا"></div><div class="sub" data-words="كل الميزات · بدون بطاقة ائتمان"></div><div class="cta">azrar-systems.com</div></div>
  <div id="progress"></div>
</div>
<script>
const FPS=30, DURATION=37.5;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;
// shot natural size is 1920x1080; show region y 40..990 (hides the app's top/bottom overlay pills)
const SRC_W=1920, CROP_Y=40, CROP_H=950;
const SCENES=[
 {t0:4.2,t1:9.2,img:'contracts',h:'كل عقودك في مكان واحد',s:'إيجار وبيع بأقساط تُحسب تلقائيًا',
  cam:[[0,.5,.5,1],[1,.62,.55,1.45]],
  chips:[{at:1.3,x:230,y:250,cls:'pri',lab:'عقود نشطة',to:6,fmt:n=>n}]},
 {t0:9.2,t1:14.7,img:'installments',h:'تحصيل الأقساط بوضوح',s:'المدفوع والمتأخر في لمحة، بتنبيه فوري',
  cam:[[0,.5,.5,1],[.5,.5,.37,1.6],[1,.5,.38,1.6]],
  chips:[{at:1.1,x:230,y:560,cls:'ok',lab:'المحصَّل',to:37200,fmt:n=>n.toLocaleString('en-US')+' د.أ'},
         {at:1.9,x:230,y:690,cls:'bad',lab:'متأخرات',to:26400,fmt:n=>n.toLocaleString('en-US')+' د.أ'}]},
 {t0:14.7,t1:19.4,img:'properties',h:'عقاراتك وملّاكك ومستأجروك',s:'ملفات كاملة بحالة كل وحدة',
  cam:[[0,.5,.5,1],[1,.6,.55,1.4]],
  chips:[{at:1.2,x:230,y:250,cls:'pri',lab:'عقارًا',to:12,fmt:n=>n}],
  swap:{at:2.4,img:'people',chips:[{at:2.6,x:230,y:690,cls:'pri',lab:'شخصًا مسجَّلًا',to:15,fmt:n=>n}]}},
 {t0:19.4,t1:24.2,img:'alerts',h:'تنبيهات ذكية قبل أن تفوتك',s:'دفعات متأخرة وعقود تقترب من نهايتها',
  cam:[[0,.5,.5,1],[1,.55,.5,1.35]],chips:[]},
 {t0:24.2,t1:29.2,img:'reports',h:'تقارير مالية بنقرة واحدة',s:'تصدير Excel وطباعة وكشوفات جاهزة',
  cam:[[0,.5,.5,1],[1,.55,.72,1.5]],
  chips:[{at:1.3,x:230,y:250,cls:'ok',lab:'المحصَّل',to:283800,fmt:n=>n.toLocaleString('en-US')+' د.أ'}]},
 {t0:29.2,t1:33.2,img:'owner',h:'كشف حساب المالك بشفافية',s:'بوابة مخصصة لكل مالك',
  cam:[[0,.5,.5,1],[1,.5,.45,1.3]],
  chips:[{at:1.2,x:230,y:250,cls:'ok',lab:'إجمالي الإيجار المحصَّل',to:283800,fmt:n=>n.toLocaleString('en-US')+' د.أ'}]},
];
const INTRO=[0,4.2], OUTRO=[33.2,37.5];
function words(el){const t=el.dataset.words;el.innerHTML=t.split(' ').map(w=>`<span class="w">${w}</span>`).join('')}
document.querySelectorAll('[data-words]').forEach(words);
const host=document.getElementById('scenes');
for(const sc of SCENES){
  const d=document.createElement('div');d.className='scene';
  d.innerHTML=`<div class="bar"></div><div class="head"><div class="h1" data-words="${sc.h}"></div><div class="h2" data-words="${sc.s}"></div></div>
  <div class="frame"><div class="shot" data-k="a"><img src="assets/shots/${sc.img}.png"></div>${sc.swap?`<div class="shot" data-k="b" style="opacity:0"><img src="assets/shots/${sc.swap.img}.png"></div>`:''}</div>`;
  host.appendChild(d);sc.el=d;d.querySelectorAll('[data-words]').forEach(words);
  const mk=(c)=>{const e=document.createElement('div');e.className='chip '+c.cls;e.innerHTML=`<span class="dot"></span><span class="lab">${c.lab}</span><span class="num"></span>`;d.appendChild(e);c.el=e;e.style.left=c.x+'px';e.style.top=c.y+'px';};
  sc.chips.forEach(mk);(sc.swap?.chips||[]).forEach(mk);
}
function camAt(keys,u){ // keys: [u,fx,fy,zoom]
  let a=keys[0],b=keys[keys.length-1];
  for(let i=0;i<keys.length-1;i++){if(u>=keys[i][0]&&u<=keys[i+1][0]){a=keys[i];b=keys[i+1];break}}
  const x=b[0]===a[0]?1:ease(clamp((u-a[0])/(b[0]-a[0])));
  return [lerp(a[1],b[1],x),lerp(a[2],b[2],x),lerp(a[3],b[3],x)];
}
function placeShot(el,fx,fy,z){
  const FW=1560,FH=742;
  const W=FW*z, H=W*CROP_H/SRC_W;           // displayed crop size
  const scale=W/SRC_W;
  let cx=fx*W, cy=fy*H;
  let tx=FW/2-cx, ty=FH/2-cy;
  tx=clamp(tx,FW-W,0); ty=clamp(ty,FH-H,0);
  el.style.transform=`translate(${tx}px,${ty-CROP_Y*scale}px) scale(${scale})`;
  const img=el.firstElementChild;img.style.width=SRC_W+'px';
}
function reveal(root,t,start,gap){ // word-by-word entrance
  root.querySelectorAll('.w').forEach((w,i)=>{
    const u=easeOut(clamp((t-start-i*gap)/.55));
    w.style.opacity=u;w.style.transform=`translateY(${(1-u)*34}px)`;
  });
}
const $=s=>document.querySelector(s);
function setTime(t){
  $('#o1').style.transform=`translate(${Math.sin(t*.25)*90}px,${Math.cos(t*.2)*70}px)`;
  $('#o2').style.transform=`translate(${Math.cos(t*.22)*-90}px,${Math.sin(t*.27)*60}px)`;
  $('#progress').style.transform=`scaleX(${clamp(t/DURATION)})`;
  // intro
  const intro=$('#intro');const iu=clamp((t-INTRO[0])/(INTRO[1]-INTRO[0]));
  intro.style.opacity=t<INTRO[1]?Math.min(easeOut(clamp(t/.6)),1-ease(clamp((t-(INTRO[1]-.5))/.5))):0;
  intro.querySelector('img').style.transform=`scale(${lerp(.82,1,easeOut(clamp(t/1.2)))})`;
  reveal(intro.querySelector('.big'),t,.9,.12);reveal(intro.querySelector('.sub'),t,1.6,.08);
  for(const sc of SCENES){
    const lt=t-sc.t0, dur=sc.t1-sc.t0;
    const vis=lt>=-.01&&lt<=dur+.01;
    sc.el.style.opacity=vis?Math.min(easeOut(clamp(lt/.5)),1-ease(clamp((lt-(dur-.45))/.45))):0;
    if(!vis)continue;
    reveal(sc.el.querySelector('.h1'),lt,.15,.1);reveal(sc.el.querySelector('.h2'),lt,.7,.06);
    const fr=sc.el.querySelector('.frame');
    const fu=easeOut(clamp(lt/.7));fr.style.transform=`translateY(${(1-fu)*60}px)`;fr.style.opacity=fu;
    const [fx,fy,z]=camAt(sc.cam,clamp(lt/dur));
    const shots=sc.el.querySelectorAll('.shot');
    shots.forEach(s=>placeShot(s,fx,fy,z));
    if(sc.swap){const m=ease(clamp((lt-sc.swap.at)/.5));shots[0].style.opacity=1-m;shots[1].style.opacity=m;}
    const all=[...sc.chips,...(sc.swap?.chips||[])];
    for(const c of all){
      const hideAt=c.swapOnly?0:0; let u=clamp((lt-c.at)/.6);
      let vis2=1;
      if(sc.swap){const m=ease(clamp((lt-sc.swap.at)/.5));vis2=sc.chips.includes(c)?1-m:m}
      const e=easeOut(u);
      c.el.style.opacity=e*vis2;
      c.el.style.transform=`translateY(${(1-e)*40}px) scale(${lerp(.9,1,e)})`;
      c.el.querySelector('.num').textContent=c.fmt(Math.round(c.to*easeOut(clamp((lt-c.at)/1.4))));
    }
  }
  // outro
  const out=$('#outro');const ou=t-OUTRO[0];
  out.style.opacity=ou>=0?easeOut(clamp(ou/.6)):0;
  out.querySelector('img').style.transform=`scale(${lerp(.85,1,easeOut(clamp(ou/1)))})`;
  reveal(out.querySelector('.big'),ou,.5,.12);reveal(out.querySelector('.sub'),ou,1.1,.08);
  const cta=out.querySelector('.cta');const cu=easeOut(clamp((ou-1.6)/.6));cta.style.opacity=cu;cta.style.transform=`translateY(${(1-cu)*30}px)`;
}
window.setTime=setTime;window.FPS=FPS;window.DURATION=DURATION;
document.fonts.ready.then(()=>{setTime(0);window.READY=true});
</script>
</body>
</html>
